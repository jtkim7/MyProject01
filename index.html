<!doctype html>
<!-- lang은 페이지의 기본 언어를 지정해 화면 읽기 프로그램이 한국어로 읽게 합니다. -->
<html lang="ko">
<head>
  <meta charset="UTF-8"> <!-- 한글이 깨지지 않도록 문자 인코딩을 지정합니다. -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- 모바일 화면 너비에 맞춰 페이지 배율을 설정합니다. -->
  <meta name="theme-color" content="#f5f7ff"> <!-- 모바일 브라우저 상단 영역의 색을 지정합니다. -->
  <title>구구단 계산기</title>
  <style>
    /* 사이트 전체에서 공통으로 사용할 글꼴과 기본 글자색입니다. */
    :root {
      color-scheme: light; /* 브라우저에 밝은 색상 테마를 사용하라고 알립니다. */
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif; /* 글꼴이 없으면 다음 글꼴을 차례로 사용합니다. */
      color: #20233a; /* 페이지 기본 글자색입니다. */
      background: #f5f7ff; /* 페이지 기본 배경색입니다. */
    }
    * { box-sizing: border-box; } /* 너비와 높이에 테두리·안쪽 여백을 포함해 계산합니다. */
    /* 화면을 꽉 채우고, 계산기 카드를 가운데에 놓습니다. */
    body {
      height: 100vh; /* 브라우저 화면 높이를 기본값으로 사용합니다. */
      height: 100svh; /* 모바일 브라우저 주소창을 고려한 실제 화면 높이입니다. */
      min-height: 400px; /* 화면 내용이 너무 납작해지지 않도록 최소 높이를 둡니다. */
      margin: 0; /* 브라우저가 기본으로 넣는 바깥 여백을 없앱니다. */
      display: grid; /* 자식 요소를 격자 레이아웃으로 배치합니다. */
      place-items: center; /* 카드를 가로·세로 가운데에 놓습니다. */
      overflow: hidden; /* 화면 바깥으로 넘치는 스크롤을 숨깁니다. */
      padding: 12px; /* 화면 가장자리와 카드 사이에 여백을 둡니다. */
      background: radial-gradient(ellipse at 12% 8%, #e1e9ff, transparent 34%),
                  radial-gradient(ellipse at 92% 88%, #eee4ff, transparent 32%), #f7f8fc;
    }
        /* 버튼의 공통 모양과 마우스·키보드 반응입니다. */
    button {
      flex: 0 0 auto; /* 버튼이 입력칸에 눌려 작아지지 않게 합니다. */
      border: 0; /* 브라우저 기본 테두리를 없앱니다. */
      border-radius: 12px; /* 모서리를 둥글게 만듭니다. */
      padding: 0 18px; /* 버튼 안쪽 좌우 여백입니다. */
      background: #6558d9; /* 버튼 배경색입니다. */
      color: #fff; /* 버튼 글자색입니다. */
      font: inherit; /* 주변 글꼴을 그대로 사용합니다. */
      font-weight: 750; /* 버튼 글자를 굵게 표시합니다. */
      cursor: pointer; /* 마우스를 올리면 클릭 가능한 모양으로 바꿉니다. */
      transition: .2s; /* 색과 위치 변화를 부드럽게 만듭니다. */
    }
    button:hover { background: #5145c4; transform: translateY(-1px); } /* 마우스를 올렸을 때 색과 위치를 바꿉니다. */
    button:focus-visible { outline: 3px solid #aaa2ff; outline-offset: 3px; } /* 키보드로 선택된 버튼에 표시를 합니다. */
    /* 흰색 둥근 계산기 카드의 크기와 그림자입니다. */
    .card {
      width: min(100%, 520px); /* 화면보다 넓어지지 않고 최대 520px까지만 넓어집니다. */
      max-height: 100%; /* 부모 화면 높이 안에 들어오도록 제한합니다. */
      overflow: hidden; /* 카드 둥근 모서리 밖으로 내용이 나오지 않게 합니다. */
      border: 1px solid #e8eaf3; /* 카드의 얇은 테두리입니다. */
      border-radius: 24px; /* 카드 모서리를 둥글게 만듭니다. */
      background: #fff; /* 카드 배경을 흰색으로 만듭니다. */
      box-shadow: 0 24px 70px #27346b17; /* 카드 뒤에 부드러운 그림자를 만듭니다. */
    }
    .intro { position: relative; padding: 24px 30px 16px; }
    /* 카드 우측 위에 배치한 닫기 아이콘입니다. */
    .close {
      position: absolute; /* 소개 영역을 기준으로 버튼을 겹쳐 배치합니다. */
      top: 16px; /* 소개 영역 위에서 16px 떨어집니다. */
      right: 18px; /* 소개 영역 오른쪽에서 18px 떨어집니다. */
      display: grid; /* × 표시를 가운데 놓기 위한 레이아웃입니다. */
      width: 32px; height: 32px; /* 닫기 버튼의 가로·세로 크기입니다. */
      place-items: center; /* × 표시를 버튼 한가운데 둡니다. */
      padding: 0; /* 버튼 기본 안쪽 여백을 없앱니다. */
      border-radius: 10px; /* 버튼 모서리를 둥글게 만듭니다. */
      background: #f1f2f8; /* 닫기 버튼 배경색입니다. */
      color: #777b91; /* × 표시의 색입니다. */
      font-size: 22px; line-height: 1; /* × 표시의 크기와 줄 높이입니다. */
    }
    .close:hover { background: #e7e8f1; color: #34364c; } /* 마우스를 올리면 닫기 버튼을 진하게 표시합니다. */
    /* 제목과 안내 문구의 글자 크기·간격입니다. */
    .eyebrow { margin: 0 0 7px; color: #6558d9; font-size: 12px; font-weight: 800; letter-spacing: .12em; } /* 위쪽 작은 영문 제목의 여백과 모양입니다. */
    h1 { margin: 0; font-size: clamp(26px, 6vw, 34px); letter-spacing: -.05em; } /* 가장 큰 제목 크기를 화면에 맞춰 조절합니다. */
    .description { margin: 8px 0 16px; color: #777b91; font-size: 14px; line-height: 1.5; } /* 제목 아래 안내 글의 간격과 줄 높이입니다. */
    form { display: flex; gap: 9px; }
    /* 입력칸 테두리와 포커스 효과입니다. */
    .input {
      display: flex; /* 입력칸과 '단' 글자를 한 줄에 놓습니다. */
      flex: 1; /* 입력칸이 남는 너비를 차지하게 합니다. */
      align-items: center; /* 입력 내용과 단 표시를 세로 가운데에 맞춥니다. */
      min-width: 0; /* 좁은 화면에서도 입력칸이 넘치지 않게 합니다. */
      height: 48px; /* 입력칸의 높이입니다. */
      padding: 0 14px; /* 입력칸 안쪽 좌우 여백입니다. */
      border: 1px solid #e4e6ef; /* 입력칸의 테두리입니다. */
      border-radius: 12px; /* 입력칸 모서리를 둥글게 만듭니다. */
      background: #fbfbfe; /* 입력칸 배경색입니다. */
    }
    .input:focus-within { border-color: #786be8; box-shadow: 0 0 0 4px #786be81a; } /* 입력할 때 테두리와 바깥 강조선을 표시합니다. */
    input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 16px; } /* 실제 입력창의 기본 테두리를 없애고 너비를 채웁니다. */
    input::placeholder { color: #a4a7b7; } /* 예시 입력 문구를 연한 색으로 표시합니다. */
    .unit { flex: 0 0 auto; color: #777b91; font-size: 14px; } /* 입력칸 오른쪽의 '단' 표시입니다. */
    form button { min-width: 98px; } /* 결과 버튼의 최소 너비입니다. */
    /* 오류 안내가 표시될 자리입니다. */
    .message { min-height: 18px; margin: 5px 2px 0; color: #d04454; font-size: 12px; } /* 오류 문구 공간을 확보해 화면이 갑자기 움직이지 않게 합니다. */
    /* 구구단 결과와 각 곱셈 줄의 모양입니다. */
    .results { padding: 12px 30px 16px; border-top: 1px solid #f0f1f6; background: #fcfcff; } /* 결과 영역의 안쪽 여백, 윗선, 배경입니다. */
    .heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 9px; } /* 결과 제목과 설명을 양쪽에 배치합니다. */
    h2 { margin: 0; font-size: 18px; } /* 몇 단의 결과인지 보여주는 제목입니다. */
    .hint { color: #9396a8; font-size: 11px; } /* 결과 범위를 안내하는 작은 글자입니다. */
    .equations { display: grid; gap: 3px; } /* 곱셈 결과를 세로로 놓고 행 사이 간격을 둡니다. */
    .equation { padding: 4px 12px; border: 1px solid #ececf5; border-radius: 10px; background: #fff; color: #55596f; font-size: 13px; font-variant-numeric: tabular-nums; } /* 곱셈 한 줄의 여백과 테두리입니다. */
    .equation strong { color: #5549c9; } /* 곱셈의 답만 강조 색으로 표시합니다. */
    .footer { padding: 0 30px 18px; } /* 아래쪽 닫기 버튼 주변의 여백입니다. */
    .footer button { width: 100%; height: 38px; border: 1px solid #e6e7f0; background: #f7f7fb; color: #55596f; } /* 아래 닫기 버튼을 카드 너비에 맞춥니다. */
    .footer button:hover { background: #ededf6; color: #34364c; } /* 마우스를 올렸을 때 닫기 버튼의 색입니다. */
    /* 좁은 화면에서는 좌우 여백과 버튼 너비를 줄입니다. */
    @media (max-width: 420px) {
      .intro, .results { padding-left: 20px; padding-right: 20px; } /* 양옆 안쪽 여백을 줄입니다. */
      .footer { padding-right: 20px; padding-left: 20px; } /* 닫기 버튼 여백도 같은 크기로 맞춥니다. */
      form { gap: 7px; } /* 입력칸과 결과 버튼 사이를 좁힙니다. */
      form button { min-width: 84px; padding: 0 12px; } /* 작은 화면에서 결과 버튼을 줄입니다. */
    }
    /* 화면 높이가 낮을 때 세로 공간을 아껴 스크롤을 줄입니다. */
    @media (max-height: 840px) {
      body { padding: 6px 12px; } /* 화면 가장자리 여백을 줄입니다. */
      .intro { padding: 14px 22px 10px; } /* 입력 안내 영역의 여백을 줄입니다. */
      .close { top: 10px; right: 14px; } /* 닫기 아이콘 위치를 카드 모서리에 맞춥니다. */
      .eyebrow { margin-bottom: 5px; } /* 작은 제목 아래 간격을 줄입니다. */
      .description { margin: 5px 0 10px; font-size: 13px; line-height: 1.35; } /* 안내 문구를 작고 촘촘하게 표시합니다. */
      .input, form button { height: 42px; } /* 입력칸과 버튼 높이를 줄입니다. */
      .message { min-height: 16px; margin-top: 4px; } /* 오류 안내 공간과 위쪽 여백을 줄입니다. */
      .results { padding: 9px 22px 11px; } /* 결과 영역의 여백을 줄입니다. */
      .heading { margin-bottom: 6px; } /* 결과 제목 아래 간격을 줄입니다. */
      .equations { gap: 2px; } /* 곱셈 줄 사이 간격을 줄입니다. */
      .equation { padding: 0 10px; font-size: 12px; line-height: 14px; } /* 각 결과 줄 높이를 줄입니다. */
      .footer { padding: 0 22px 10px; } /* 아래 닫기 버튼 주변 여백을 줄입니다. */
      .footer button { height: 34px; } /* 아래 닫기 버튼 높이를 줄입니다. */
    }
    /* 아주 낮은 화면에서는 글자와 간격을 한 번 더 축소합니다. */
    @media (max-height: 430px) {
      .intro { padding: 7px 18px 5px; } /* 소개 영역의 안쪽 여백을 더 줄입니다. */
      .close { top: 5px; right: 14px; width: 27px; height: 27px; } /* 작은 화면에 맞춰 닫기 아이콘을 축소합니다. */
      .eyebrow { margin-bottom: 2px; font-size: 10px; } /* 위쪽 작은 제목을 축소합니다. */
      h1 { font-size: 23px; } /* 메인 제목을 축소합니다. */
      .description { margin: 3px 0 6px; font-size: 12px; line-height: 1.3; } /* 안내 문구의 크기와 간격을 줄입니다. */
      .input, form button { height: 38px; } /* 입력칸과 결과 버튼을 더 낮게 만듭니다. */
      .message { min-height: 14px; margin-top: 2px; font-size: 11px; } /* 오류 표시 공간을 줄입니다. */
      .results { padding: 5px 18px 6px; } /* 결과 영역 여백을 더 줄입니다. */
      .heading { margin-bottom: 3px; } /* 결과 제목 아래 간격을 줄입니다. */
      h2 { font-size: 15px; } /* 단 제목을 축소합니다. */
      .hint { font-size: 10px; } /* 범위 안내 글자를 축소합니다. */
      .equations { gap: 1px; } /* 결과 줄 간격을 최소화합니다. */
      .equation { padding: 0 8px; font-size: 11px; line-height: 12px; } /* 결과 줄 높이를 최소화합니다. */
      .footer { padding: 0 18px 5px; } /* 아래 버튼 주변 여백을 줄입니다. */
      .footer button { height: 30px; } /* 아래 닫기 버튼을 낮게 만듭니다. */
    }
    /* 사용자가 애니메이션 최소화를 선택했으면 움직임을 줄입니다. */
    @media (prefers-reduced-motion: reduce) { * { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="card">
    <!-- 단 입력과 계산 버튼이 있는 영역입니다. -->
    <section class="intro" aria-labelledby="page-title">
      <!-- aria-label은 아이콘 버튼의 이름을 읽어주고, data-close는 JS에서 버튼을 찾는 표식입니다. -->
      <button class="close" type="button" aria-label="닫기" data-close>×</button>
      <p class="eyebrow">MULTIPLICATION TABLE</p>
      <h1 id="page-title">구구단 계산기</h1>
      <p class="description">궁금한 단을 입력하면 1부터 9까지의 구구단을 보여드려요.</p>
      <form id="form">
        <!-- label이 입력칸과 '단' 글자를 함께 묶어 접근성을 높입니다. -->
        <label class="input">
          <!-- id는 JavaScript가 찾는 이름, placeholder는 예시, inputmode는 휴대폰 숫자 키패드 설정입니다. -->
          <!-- autocomplete=off는 이전 입력 자동완성을 끄고, aria-describedby는 안내 문구를 연결합니다. -->
          <input id="dan" type="text" placeholder="예: 7" inputmode="numeric" autocomplete="off" aria-describedby="message">
          <span class="unit">단</span>
        </label>
        <button type="submit">결과 보기</button> <!-- 제출 버튼을 누르면 form의 submit 이벤트가 실행됩니다. -->
      </form>
      <p class="message" id="message" role="alert"></p> <!-- role=alert는 새 오류 안내를 보조기술에 알립니다. -->
    </section>
    <!-- JavaScript가 만든 구구단이 표시되는 영역입니다. 처음에는 숨겨져 있습니다. -->
    <!-- id는 JavaScript가 찾는 이름, hidden은 처음에 결과를 감추는 속성입니다. -->
    <section class="results" id="results" aria-live="polite" aria-label="구구단 결과" hidden>
      <div class="heading"><h2 id="title"></h2><span class="hint">1부터 9까지</span></div>
      <div class="equations" id="equations"></div>
    </section>
    <!-- 아래쪽 닫기 버튼입니다. 위쪽 아이콘과 같은 기능을 합니다. -->
    <!-- type=button은 form 제출을 막고, data-close로 닫기 동작을 연결합니다. -->
    <footer class="footer"><button type="button" data-close>닫기</button></footer>
  </main>
  <script>
    // 화면 요소를 찾아 변수에 저장해 두면 아래에서 다시 사용할 수 있습니다.
    const form = document.querySelector("#form");
    const input = document.querySelector("#dan");
    const message = document.querySelector("#message");
    const results = document.querySelector("#results");
    const title = document.querySelector("#title");
    const equations = document.querySelector("#equations");

    // 입력이 잘못되면 안내하고, 결과를 감춘 뒤 입력값을 전체 선택합니다.
    function showError(text) {
      message.textContent = text;
      results.hidden = true;
      input.select();
    }

    // 단을 확인하고 올바른 값이면 구구단을 화면에 그립니다.
    // requireValue는 '결과 보기'를 눌렀는데 입력이 비어 있는지 구분합니다.
    function showResults(requireValue = false) {
      const value = input.value.trim();
      // 공백만 입력했거나 값이 없으면 결과를 감춥니다.
      if (!value) {
        message.textContent = requireValue ? "단을 입력해 주세요." : "";
        results.hidden = true;
        return;
      }

      // 정규식은 문자열 전체가 숫자인지 확인하고, 다음 조건은 1~9인지 확인합니다.
      if (!/^\d+$/.test(value)) return showError("숫자만 입력해 주세요.");
      const dan = Number(value);
      if (dan < 1 || dan > 9) return showError("1~9까지만 입력해 주세요.");

      message.textContent = "";
      title.textContent = `${dan}단`;
      // 문서 조각에 결과 9개를 모은 다음 화면에 한 번에 추가합니다.
      const rows = document.createDocumentFragment();
      for (let multiplier = 1; multiplier <= 9; multiplier++) {
        const row = document.createElement("div");
        const product = document.createElement("strong");
        row.className = "equation";
        row.append(`${dan} × ${multiplier} = `);
        product.textContent = String(dan * multiplier);
        row.append(product);
        rows.append(row);
      }
      equations.replaceChildren(rows);
      results.hidden = false;
    }

    // 입력할 때마다 즉시 갱신하고, 제출할 때는 빈 값 검사도 요청합니다.
    input.addEventListener("input", () => showResults());
    form.addEventListener("submit", (event) => {
      event.preventDefault();
      showResults(true);
      input.focus();
    });

    // 브라우저가 창 닫기를 막으면 사용자가 직접 닫도록 안내합니다.
    function closeWindow() {
      window.close();
      if (!window.closed) message.textContent = "브라우저에서 창을 직접 닫아 주세요.";
    }
    document.querySelectorAll("[data-close]").forEach((button) => button.addEventListener("click", closeWindow));
  </script>
</body>
</html>
